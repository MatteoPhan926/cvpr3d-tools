[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cvpr3d-tools"
version = "0.1.0"
description = "Offline GLB inspection and evidence integrity tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSING.md", "NOTICE.md"]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
cvpr3d = "cvpr3d.__main__:main"

[tool.setuptools]
packages = ["cvpr3d"]
include-package-data = false
